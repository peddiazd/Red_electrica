<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor de archivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px;cursor:pointer;text-decoration:none;transition:all .15s}
.back-btn:hover{background:#30363d;color:#e6edf3}
.file-title{font-size:14px;font-weight:500;color:#e6edf3;flex:1}
.file-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:#21262d;color:#8b949e;border:1px solid #30363d}
.content{max-width:860px;margin:0 auto;padding:2rem 24px}
pre{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:1.5rem;overflow-x:auto;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;line-height:1.7;color:#e6edf3;white-space:pre-wrap;word-break:break-word}
.md-content{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:2rem;line-height:1.8;font-size:14px;color:#c9d1d9}
.md-content h1{font-size:22px;font-weight:600;color:#e6edf3;margin:0 0 1.2rem;padding-bottom:.75rem;border-bottom:1px solid #30363d}
.md-content h2{font-size:17px;font-weight:600;color:#e6edf3;margin:1.8rem 0 .75rem}
.md-content h3{font-size:15px;font-weight:500;color:#c9d1d9;margin:1.2rem 0 .5rem}
.md-content p{margin:.75rem 0;color:#c9d1d9}
.md-content ul,.md-content ol{margin:.5rem 0 .75rem 1.5rem;color:#c9d1d9}
.md-content li{margin:.3rem 0;line-height:1.7}
.md-content code{background:#21262d;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;color:#f0883e;border:1px solid #30363d}
.md-content pre{margin:.75rem 0;background:#0d1117}
.md-content strong{color:#e6edf3;font-weight:500}
.md-content hr{border:none;border-top:1px solid #30363d;margin:1.5rem 0}
.md-content table{width:100%;border-collapse:collapse;font-size:13px;margin:.75rem 0}
.md-content th{background:#21262d;color:#e6edf3;padding:8px 12px;text-align:left;border:1px solid #30363d;font-weight:500}
.md-content td{padding:8px 12px;border:1px solid #21262d;color:#c9d1d9}
.md-content tr:nth-child(even) td{background:#161b22}
.error{padding:2rem;text-align:center;color:#f85149;font-size:14px}
.kw{color:#ff7b72}.str{color:#a5d6ff}.cm{color:#8b949e;font-style:italic}.num{color:#79c0ff}.fn{color:#d2a8ff}.bl{color:#ff7b72}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="back-btn">&#8592; Volver al inicio</a>
  <span class="file-title" id="ftitle">Cargando...</span>
  <span class="file-badge" id="fbadge">...</span>
</div>
<div class="content" id="content">
  <p style="color:#8b949e;text-align:center;padding:3rem">Cargando archivo...</p>
</div>
<script>
const params=new URLSearchParams(location.search);
const file=params.get('file')||'';
const title=decodeURIComponent(params.get('title')||file);
const ext=file.split('.').pop().toLowerCase();
document.getElementById('ftitle').textContent=title;
document.getElementById('fbadge').textContent='.'+ext;
document.title=title+' — Red Eléctrica UCC';

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function highlightPy(code){
  const kws=['def','class','import','from','return','if','elif','else','for','while','in','not','and','or','True','False','None','with','as','try','except','raise','break','continue','pass','lambda','yield','global','nonlocal'];
  const bltins=['print','len','range','sorted','list','dict','set','tuple','str','int','float','bool','type','isinstance','enumerate','zip','map','filter','min','max','sum','abs','round','open','input','append','extend'];
  let lines=code.split('\n');
  return lines.map(line=>{
    let esc=escHtml(line);
    if(esc.trim().startsWith('#')){return '<span class="cm">'+esc+'</span>'}
    esc=esc.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"]*"|'[^']*')/g,'<span class="str">$1</span>');
    esc=esc.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
    kws.forEach(k=>{esc=esc.replace(new RegExp('\\b'+k+'\\b','g'),'<span class="kw">'+k+'</span>')});
    bltins.forEach(k=>{esc=esc.replace(new RegExp('\\b'+k+'\\b','g'),'<span class="fn">'+k+'</span>')});
    esc=esc.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\s*(?=\()/g,(m,n)=>{
      if(kws.includes(n)||bltins.includes(n))return m;
      return '<span class="fn">'+n+'</span>(';
    });
    return esc;
  }).join('\n');
}

function renderMd(text){
  let html=escHtml(text);
  html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/`([^`]+)`/g,'<code>$1</code>');
  html=html.replace(/^---$/gm,'<hr>');
  html=html.replace(/^\* (.+)$/gm,'<li>$1</li>');
  html=html.replace(/^- (.+)$/gm,'<li>$1</li>');
  html=html.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  html=html.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  html=html.replace(/\n\n/g,'</p><p>');
  html='<p>'+html+'</p>';
  html=html.replace(/<p>(<h[123]>)/g,'$1');
  html=html.replace(/(<\/h[123]>)<\/p>/g,'$1');
  html=html.replace(/<p>(<ul>)/g,'$1');
  html=html.replace(/(<\/ul>)<\/p>/g,'$1');
  html=html.replace(/<p>(<hr>)<\/p>/g,'$1');
  html=html.replace(/<p>\s*<\/p>/g,'');
  return html;
}

fetch(file)
  .then(r=>{
    if(!r.ok)throw new Error('No se pudo cargar el archivo ('+r.status+')');
    return r.text();
  })
  .then(text=>{
    const content=document.getElementById('content');
    if(ext==='py'){
      content.innerHTML='<pre>'+highlightPy(text)+'</pre>';
    }else if(ext==='md'){
      content.innerHTML='<div class="md-content">'+renderMd(text)+'</div>';
    }else{
      content.innerHTML='<pre>'+escHtml(text)+'</pre>';
    }
  })
  .catch(err=>{
    document.getElementById('content').innerHTML='<div class="error">'+err.message+'</div>';
  });
</script>
</body>
</html>
